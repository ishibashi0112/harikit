name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Harikit#Ci1"
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 30); do
            node -e "require('mssql').connect({server:'localhost',user:'sa',password:'Harikit#Ci1',options:{encrypt:false,trustServerCertificate:true}}).then(p=>p.close()).then(()=>process.exit(0),()=>process.exit(1))" && exit 0
            sleep 2
          done
          exit 1
      - run: npm test
        env:
          HARIKIT_TEST_MSSQL: '{"server":"localhost","user":"sa","password":"Harikit#Ci1"}'

  # Node 版を実際の Oracle で通す。23ai Free と、業務でまだ多い 19c に近い 21c XE の 2 つ。
  oracle:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gvenzl/oracle-free:23-slim
            service: FREEPDB1
          - image: gvenzl/oracle-xe:21-slim
            service: XEPDB1
    services:
      oracle:
        image: ${{ matrix.image }}
        env:
          ORACLE_PASSWORD: Harikit1
          APP_USER: harikit
          APP_USER_PASSWORD: Harikit1
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          HARIKIT_TEST_ORACLE: '{"connectString":"localhost:1521/${{ matrix.service }}","user":"harikit","password":"Harikit1"}'

  # C# 版を Mono の ASP.NET（WebMethod）で動かし、実際の SQL Server で通す。
  dotnet:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Harikit#Ci1"
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Mono
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mono-complete
      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 30); do
            node -e "require('mssql').connect({server:'localhost',user:'sa',password:'Harikit#Ci1',options:{encrypt:false,trustServerCertificate:true}}).then(p=>p.close()).then(()=>process.exit(0),()=>process.exit(1))" && exit 0
            sleep 2
          done
          exit 1
      - run: npm run test:dotnet
        env:
          HARIKIT_TEST_MSSQL: '{"server":"localhost","user":"sa","password":"Harikit#Ci1"}'

  # C# 版を Windows の IIS（.NET Framework 4.8）に載せ、Windows に入れた SQL Server Express（Microsoft の最新版、今は 2025）で通す（本番に近い形）。
  # 載せ方は 2 つ: app_code はソースを App_Code に置く Web サイトの形（IIS が .NET Framework 付属の C# 5 のコンパイラでビルドする）、
  # bin は build.cmd（csc）で作った DLL を置く形。テストは Mono のジョブと同じもの（packages/server-dotnet/test/host.mjs）。
  # ほかの .NET 版（VB.NET など）は、matrix に package（packages/ の下のフォルダ）を足せば同じテストで通る。
  iis:
    name: iis (${{ matrix.package }}, ${{ matrix.layout }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        package: [server-dotnet]
        layout: [app_code, bin]
    env:
      HARIKIT_TEST_MSSQL: '{"server":"localhost","user":"sa","password":"Harikit#Ci1"}'
    steps:
      - uses: actions/checkout@v4
      - name: Install SQL Server Express
        run: .github/scripts/install-sqlserver.ps1 -SaPassword 'Harikit#Ci1'
      - name: Install IIS and ASP.NET 4.8
        run: |
          $r = Install-WindowsFeature -Name Web-Server, Web-Asp-Net45
          $r | Format-List Success, RestartNeeded, ExitCode, FeatureResult
          if (-not $r.Success) { exit 1 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Wait for SQL Server
        shell: bash
        run: |
          for i in $(seq 1 30); do
            node -e "require('mssql').connect({server:'localhost',user:'sa',password:'Harikit#Ci1',options:{encrypt:false,trustServerCertificate:true}}).then(p=>p.close()).then(()=>process.exit(0),e=>{console.error(e.message);process.exit(1)})" && exit 0
            sleep 2
          done
          exit 1
      - name: Test on IIS
        run: node --test packages/server-dotnet/test/webmethod.integration.test.mjs
        env:
          HARIKIT_TEST_DOTNET_HOST: iis
          HARIKIT_TEST_DOTNET_LAYOUT: ${{ matrix.layout }}
          HARIKIT_TEST_DOTNET_PKG: packages/${{ matrix.package }}
      - name: Show server logs
        if: failure()
        run: |
          Get-ChildItem C:\harikit-test -Recurse -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { "== $($_.FullName)"; Get-Content $_.FullName -Tail 200 }
          Get-WinEvent -LogName Application -MaxEvents 200 -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -match 'ASP\.NET|W3SVC|WAS|IIS' } |
            Select-Object -First 20 | Format-List TimeCreated, ProviderName, Message
